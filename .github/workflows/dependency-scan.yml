# Goal - I have to ensure the packages abd dependecies have been audited for security

name: Dependecy Scan

on: 
    workflow_call:


jobs:
    dependecy-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: 1.22
                go-version-file: 'go.mod'
                cache-dependency-path: 'go.sum'

            - name: Install Govalcheck
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

            - name: GoVulnCheck
              continue-on-error: true
              run: govulncheck ./... > reports/dependency-scan-result
              working-directory: ./backend


            - name: Setup NodeJs
              uses: actions/setup-node@v7
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Run Dependency Scan for Node
              run: npm audit
              working-directory: ./frontend

             # Upload the output as an artifact
            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                name: dependency-scan-result      # Name of the artifact
                path: reports/dependency-scan-result         # File or directory path to upload
                retention-days: 7    

            
    