# Goal - i have to do SAST (Static Application Security Test) for my code 

name: Code Quality

on:
    workflow_call: # you can call this workflow before/after any other workflow

jobs:
    sast:
        runs-on: ubuntu-latest
        steps:
            - name: checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              working-directory: ./frontend  
              run: npm ci

            - name: Run Linter
              working-directory: ./frontend
              run: npm run lint  

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.23'
                go-version-file: 'go.mod'
                cache-dependency-path: 'go.sum'
            
            - name: Run go Formatter
              working-directory: ./backend
              run: go fmt

            - name: Run Go Vet
              working-directory: ./backend
              run: go vet  