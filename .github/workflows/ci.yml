# Goal - I have to Lint, Build and Test the code for frontend and backend.
# then push the images to DockerHub.

name: CI

on:
    push:
        branches: [advanced]

jobs:
# github runner.
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              run: npm ci

            - name: Run Linter
              run: npm run lint
              
            - name: Run Tests
              run: npm run test  
            #- test
            #- push
    
