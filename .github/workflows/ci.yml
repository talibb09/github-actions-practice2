# Goal - I have to Lint, Build and Test the code for frontend and backend.
# then push the images to DockerHub.

name: CI

on:
    push:
        branches: [advanced]

jobs:
# github runner.
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              working-directory: ./frontend  
              run: npm ci

            - name: Run Linter
              working-directory: ./frontend
              run: npm run lint
              
            - name: Run Tests
              working-directory: ./frontend
              run: npm run test  

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend        # folder that holds the frontend code
                file: ./frontend/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-frontend:latest  
            #- test
            #- push
    
