# Goal - I have to Lint, Build and Test the code for frontend and backend.
# then push the images to DockerHub.

name: CI

on:
    push:
      
      branches: [feat/matrix-docker-build]

jobs:
# github runner.
    lint-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              working-directory: ./frontend  
              run: npm ci

            - name: Run Linter
              working-directory: ./frontend
              run: npm run lint
              
            - name: Run Tests
              working-directory: ./frontend
              run: npm run test  

    lint-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.23'
                go-version-file: 'go.mod'
                cache-dependency-path: 'go.sum'
            
            - name: Run go Formatter
              working-directory: ./backend
              run: go fmt

            - name: Run Go Vet
              working-directory: ./backend
              run: go vet
              
            - name: Run Tests
              working-directory: ./backend
              run: go test

    build-and-push:
      needs: [lint-frontend, lint-backend]
      runs-on: ubuntu-latest
      strategy:
        matrix:
          folder: ['frontend','backend']
      steps:
          - name: Checkout Code
            uses: actions/checkout@v7

          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Docker build and push
            uses: docker/build-push-action@v7
            with:
              context: ./${{matrix.folder}} 
              push: true
              tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-${{matrix.folder}}:latest  

    deploy:
        needs: [lint-frontend,lint-backend,build-and-push]
        uses: ./.github/workflows/cd.yml
        secrets: inherit            
      