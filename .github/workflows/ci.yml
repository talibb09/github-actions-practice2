# Goal - I have to Lint, Build and Test the code for frontend and backend.
# then push the images to DockerHub.

name: CI

on:
    workflow_dispatch:

jobs:
# github runner.
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
        
            - name: Run Tests
              working-directory: ./frontend
              run: npm run test  

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend        # folder that holds the frontend code
                file: ./frontend/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-frontend:latest
    
    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
          
            - name: Run Tests
              working-directory: ./backend
              run: go test

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./backend      # folder that holds the backend code
                file: ./backend/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-backend:latest

    deploy:
        needs: [frontend, backend]
        uses: ./.github/workflows/cd.yml
        secrets: inherit            
      