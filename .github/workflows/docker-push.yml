# Goal - Is to push to Docker HUb

name: Docker Push

on:
    workflow_call:

jobs:
# github runner.
    build-and-puhs:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders: ['frontend', 'backend']
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7 

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./${{matrix.folders}}      # folder that holds the frontend code
                file: ./${{matrix.folders}}/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-${{matrix.folders}}:latest
