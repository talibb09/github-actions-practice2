# Goal - to run end to end devsecops CI pipeline

name: DevSecOps

on:
    push:
        branches: [feat/matrix-docker-build]

jobs:
    # ---CI----
    code-quality:
    # Code Stage    
        uses: ./.github/workflows/code-quality.yml

    # Secret Scanning
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml 
        
    # Dependency Check
    dependency-check:
        uses: ./.github/workflows/dependency-scan.yml    

    # Docker Checks
    docker-lint-and-scan:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    # SonarQube
    sonar-qube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    # code Tests
    code-test:
        uses: ./.github/workflows/code-test.yml
        
    # Push to DockerHub
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,secret-scanning,dependency-check, docker-lint-and-scan,sonar-qube,code-test ]
        secrets: inherit 

    # ---CD----    
    Deploy:
        needs: [docker-push]
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
